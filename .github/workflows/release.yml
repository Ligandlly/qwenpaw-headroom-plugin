name: Release offline package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0). Leave empty to only upload the artifact."
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Check tag matches plugin.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os, sys
          version = json.load(open("plugin.json"))["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if version != tag:
              sys.exit(f"tag {tag} != plugin.json version {version}")
          print(f"version {version} matches the tag")
          PY

      - name: Build offline package
        run: python scripts/package_offline.py --out-dir release

      - name: Show package contents
        run: |
          ls -l release
          python - <<'PY'
          import zipfile, glob
          for archive in glob.glob("release/*.zip"):
              with zipfile.ZipFile(archive) as zf:
                  print(archive)
                  for info in zf.infolist():
                      print(f"  {info.file_size:>8}  {info.filename}")
          PY

      - name: Smoke-test the router against a stub proxy
        run: python scripts/smoke_routes.py

      - uses: actions/upload-artifact@v4
        with:
          name: headroom-plugin-offline
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Headroom 上下文压缩插件 ${{ github.ref_name }}
          files: |
            release/*.zip
            release/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 离线安装包

            | 文件 | 说明 |
            | --- | --- |
            | `headroom-plugin-*.zip` | 解压到 `~/.qwenpaw/plugins/` 即可，无需联网、无需安装依赖 |
            | `headroom-plugin-*.zip.sha256` | 校验和（可复现构建） |

            ```bash
            sha256sum -c headroom-plugin-*.zip.sha256
            unzip headroom-plugin-*.zip -d ~/.qwenpaw/plugins/
            ```

            安装后修改 `~/.qwenpaw/plugins/headroom/headroom.config.json` 里的
            `headroom.base_url` 指向内网代理地址（可只写 `host:port`），重启 QwenPaw 即可。

            详见 [README](https://github.com/${{ github.repository }}#readme)。
