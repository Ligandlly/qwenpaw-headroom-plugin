name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Verify the offline package still builds
        run: python scripts/package_offline.py --out-dir /tmp/release

      - name: Check the frontend is a valid ES module
        run: |
          node --input-type=module --eval "$(cat frontend/dist/index.js)" || true
          node -e "const fs=require('fs');const src=fs.readFileSync('frontend/dist/index.js','utf8');if(!/whenHost/.test(src))process.exit(1);console.log('frontend ok');"

  manifest:
    name: Manifest and packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: plugin.json must stay on the legacy PluginApi
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("plugin.json"))
          assert "sdk" not in m, "plugin.json must not declare 'sdk' (needs the legacy PluginApi router)"
          assert m["entry"]["backend"] == "plugin.py"
          assert m["entry"]["frontend"] == "frontend/dist/index.js"
          assert m["qwenpaw_version"]["min"]
          print("manifest ok", m["id"], m["version"])
          PY

      - name: No third-party imports on the backend
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          allowed = {"fastapi", "pydantic", "qwenpaw"}
          bad = []
          for path in sorted(pathlib.Path("headroom_plugin").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:  # relative import inside the plugin package
                          continue
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      root = name.split(".")[0]
                      if not root or root in allowed or root.startswith("_"):
                          continue
                      if root in sys.stdlib_module_names:
                          continue
                      bad.append(f"{path}:{node.lineno}: {name}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("stdlib-only backend ok")
          PY

      - name: Build twice and compare hashes (reproducible archive)
        run: |
          python scripts/package_offline.py --out-dir /tmp/a >/dev/null
          python scripts/package_offline.py --out-dir /tmp/b >/dev/null
          sha256sum /tmp/a/*.zip /tmp/b/*.zip
          cmp /tmp/a/*.zip /tmp/b/*.zip
          echo "reproducible build ok"
